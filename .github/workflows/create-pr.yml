name: Create Pull Request

on:
  push:
    branches:
      - feature/**  # feature 브랜치에 push 될 때 PR 자동 생성

jobs:
  create_pull_request:
    runs-on: ubuntu-latest

    # ✅ 특정 사용자(push한 사람)가 'kdw'일 경우는 실행하지 않음
    if: github.actor != WantOscar'  # ← 여기에 본인 GitHub ID 넣기

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔍 Checking if PR already exists..."
          PR_EXISTS=$(gh pr list --base main --head ${{ github.ref_name }} --json number --jq '.[0].number')

          if [ -z "$PR_EXISTS" ]; then
            echo "🚀 Creating new PR..."
            gh pr create \
              --title "✨ 자동 PR 생성: ${{ github.ref_name }}" \
              --body "자동으로 생성된 Pull Request입니다." \
              --base main \
              --head ${{ github.ref_name }}
          else
            echo "⚠️ PR already exists (#$PR_EXISTS). Skipping creation."
          fi
